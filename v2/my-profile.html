<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GDSQ My Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#10151b;color:#fff;font-family:system-ui,'Noto Sans Thai',sans-serif}.cut{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}.card{background:#222931;border:1px solid #39434d}.soft{background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.1);border-radius:8px}.lime{color:#c7ff2e}.bg-lime{background:#c7ff2e;color:#10151b}.btn{min-height:44px;border:1px solid rgba(255,255,255,.15);font-weight:900}input{min-height:48px;background:#10151b!important;color:#fff!important;border-color:#3a424a!important}.mini{font-size:12px;color:#94a3b8}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;border:1px solid rgba(199,255,46,.5);color:#c7ff2e;background:rgba(199,255,46,.14)}button:disabled{cursor:not-allowed;opacity:.55}
  </style>
</head>
<body>
  <header class="sticky top-0 z-50 border-b border-white/10 bg-[#0d1217]/95 p-3">
    <div class="mx-auto flex max-w-2xl items-center justify-between gap-2">
      <div><div class="text-[10px] tracking-[.25em] lime">GDSQ PICKLEBALL</div><b id="pageTitle">โปรไฟล์ของฉัน</b></div>
      <div class="flex gap-2">
        <a id="joinLink" class="cut btn bg-white/5 px-3 py-2 text-xs" href="./join.html?mode=supabase">เข้าร่วม</a>
        <button id="languageBtn" class="cut btn bg-white/5 px-3 py-2 text-xs" type="button">TH</button>
      </div>
    </div>
  </header>
  <main class="mx-auto max-w-2xl p-4">
    <section class="cut card mt-4 p-5">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p id="kicker" class="text-xs font-black tracking-[.18em] lime">บัญชีผู้เล่น</p>
          <h1 id="heading" class="mt-1 text-3xl font-black">ประวัติผู้เล่นของฉัน</h1>
          <p id="intro" class="mini mt-2">เข้าสู่ระบบด้วยอีเมลเพื่อเก็บและดูสถิติข้ามอุปกรณ์อย่างปลอดภัย</p>
        </div>
        <span id="authStatus" class="pill">GUEST</span>
      </div>
      <div class="mt-4 grid gap-3">
        <label class="text-xs font-black text-slate-400">
          <span id="emailLabel">อีเมล</span>
          <input id="email" class="mt-1 w-full rounded-lg border p-4" type="email" placeholder="name@example.com" autocomplete="email">
        </label>
        <div class="grid gap-2 sm:grid-cols-2">
          <button id="authBtn" class="cut bg-lime px-5 py-4 font-black" type="button">ส่งลิงก์เข้าสู่ระบบ</button>
          <button id="signOutBtn" class="cut btn hidden bg-white/5 px-5 py-4" type="button">ออกจากระบบ</button>
        </div>
      </div>
      <div id="message" class="hidden mt-3 rounded-lg border p-3 text-sm" role="status"></div>
    </section>

    <section id="profileCard" class="cut card mt-4 hidden p-5">
      <div class="flex items-center gap-3">
        <img id="avatar" class="hidden h-16 w-16 rounded-full border border-lime-300/40 object-cover" alt="Player profile">
        <div id="initial" class="flex h-16 w-16 items-center justify-center rounded-full bg-slate-700 text-xl font-black"></div>
        <div>
          <h2 id="name" class="text-2xl font-black lime">-</h2>
          <p id="profileEmail" class="mini">-</p>
          <span id="registeredBadge" class="pill mt-2">ผู้เล่นที่ลงทะเบียน</span>
        </div>
      </div>
      <div id="summary" class="mt-5 grid grid-cols-2 gap-2 md:grid-cols-5"></div>
    </section>

    <section id="historyCard" class="cut card mt-4 hidden p-5">
      <div class="flex items-center justify-between gap-3">
        <div><h2 id="historyTitle" class="text-2xl font-black lime">ประวัติการแข่งขัน</h2><p id="historyInfo" class="mini mt-1">เฉพาะแมตช์ที่ยืนยันผลแล้ว</p></div>
        <b id="eventCount" class="text-sm"></b>
      </div>
      <div id="history" class="mt-4 grid gap-3"></div>
    </section>
  </main>

  <script type="module">
    import { createV2Services } from './src/services/index.js?v=secure-profile-01';

    const $ = (id) => document.getElementById(id);
    const services = createV2Services();
    let authPlayer = null;
    let busy = false;
    let messageKey = '';

    function language() {
      return localStorage.getItem('gdsq_v2_ui_lang') === 'en' ? 'en' : 'th';
    }

    function text(key) {
      const en = {
        pageTitle: 'MY PROFILE', join: 'JOIN', kicker: 'PLAYER ACCOUNT', heading: 'My player history',
        intro: 'Sign in by email to securely keep and view statistics across devices.', email: 'Email',
        sendLink: 'SEND SIGN-IN LINK', view: 'VIEW HISTORY', signOut: 'SIGN OUT', guest: 'GUEST',
        verified: 'VERIFIED', registered: 'REGISTERED PLAYER', history: 'MATCH HISTORY',
        historyInfo: 'Confirmed matches only', sent: 'Check your email and open the GDSQ sign-in link.',
        signedOut: 'Signed out.', noProfile: 'No player profile yet. Join a live event once with this email.',
        invalidEmail: 'Enter a valid email address.', loading: 'LOADING...', loaded: 'Player history loaded.',
        games: 'Games', winRate: 'Win rate', pointDiff: 'Point diff', events: 'Events',
        win: 'Won', loss: 'Lost', opponent: 'Opponent', noHistory: 'No confirmed matches in your overall history yet.',
        error: 'Could not load your profile. Please try again.'
      };
      const th = {
        pageTitle: 'โปรไฟล์ของฉัน', join: 'เข้าร่วม', kicker: 'บัญชีผู้เล่น', heading: 'ประวัติผู้เล่นของฉัน',
        intro: 'เข้าสู่ระบบด้วยอีเมลเพื่อเก็บและดูสถิติข้ามอุปกรณ์อย่างปลอดภัย', email: 'อีเมล',
        sendLink: 'ส่งลิงก์เข้าสู่ระบบ', view: 'ดูประวัติ', signOut: 'ออกจากระบบ', guest: 'GUEST',
        verified: 'ยืนยันแล้ว', registered: 'ผู้เล่นที่ลงทะเบียน', history: 'ประวัติการแข่งขัน',
        historyInfo: 'เฉพาะแมตช์ที่ยืนยันผลแล้ว', sent: 'กรุณาเปิดอีเมล แล้วกดลิงก์เข้าสู่ระบบ GDSQ',
        signedOut: 'ออกจากระบบแล้ว', noProfile: 'ยังไม่มีโปรไฟล์ กรุณาเข้าร่วมอีเว้นท์ Live ด้วยอีเมลนี้หนึ่งครั้ง',
        invalidEmail: 'กรุณาใส่อีเมลให้ถูกต้อง', loading: 'กำลังโหลด...', loaded: 'โหลดประวัติผู้เล่นแล้ว',
        games: 'เกม', winRate: 'อัตราชนะ', pointDiff: 'ผลต่างคะแนน', events: 'อีเว้นท์',
        win: 'ชนะ', loss: 'แพ้', opponent: 'คู่แข่ง', noHistory: 'ยังไม่มีแมตช์ที่ยืนยันผลในประวัติรวม',
        error: 'โหลดโปรไฟล์ไม่สำเร็จ กรุณาลองอีกครั้ง'
      };
      return (language() === 'en' ? en : th)[key] || key;
    }

    function applyLanguage() {
      document.documentElement.lang = language();
      $('pageTitle').textContent = text('pageTitle');
      $('joinLink').textContent = text('join');
      $('languageBtn').textContent = language() === 'en' ? 'EN' : 'TH';
      $('languageBtn').setAttribute('aria-label', language() === 'en' ? 'Switch to Thai' : 'เปลี่ยนเป็นภาษาอังกฤษ');
      $('kicker').textContent = text('kicker');
      $('heading').textContent = text('heading');
      $('intro').textContent = text('intro');
      $('emailLabel').textContent = text('email');
      $('authBtn').textContent = busy ? text('loading') : authPlayer ? text('view') : text('sendLink');
      $('signOutBtn').textContent = text('signOut');
      $('authStatus').textContent = authPlayer ? text('verified') : text('guest');
      $('registeredBadge').textContent = text('registered');
      $('historyTitle').textContent = text('history');
      $('historyInfo').textContent = text('historyInfo');
      if (messageKey) $('message').textContent = text(messageKey);
    }

    function setBusy(next) {
      busy = next;
      $('authBtn').disabled = next;
      $('signOutBtn').disabled = next;
      applyLanguage();
    }

    function showMessage(message, error = false, key = '') {
      const box = $('message');
      messageKey = key;
      box.textContent = message;
      box.className = `mt-3 rounded-lg border p-3 text-sm ${error ? 'border-red-300/40 bg-red-300/10 text-red-100' : 'border-lime-300/40 bg-lime-300/10 text-lime-100'}`;
    }

    const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
    const eventTitle = (event) => event?.name || event?.name_th || event?.name_en || 'Untitled Event';
    const itemId = (item) => String(typeof item === 'string' ? item : (item?.id || item?.eventPlayerId || item?.event_player_id || ''));
    const matchTeams = (match) => ({ a: match.teamA || match.team_a || [], b: match.teamB || match.team_b || [] });
    const score = (match, side) => Number(side === 'A' ? (match.teamAScore ?? match.team_a_score ?? 0) : (match.teamBScore ?? match.team_b_score ?? 0));
    const winner = (match) => String(match.winner || '').toUpperCase();
    const isConfirmed = (match) => ['confirmed', 'completed'].includes(String(match.status || '').toLowerCase());

    function formatDate(value) {
      const date = new Date(value || '');
      return Number.isNaN(date.getTime()) ? '-' : date.toLocaleDateString(language() === 'en' ? 'en-US' : 'th-TH', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    async function loadProfile() {
      const email = $('email').value.trim().toLowerCase();
      const profile = await services.findPlayerProfileByEmail(email);
      if (!profile) {
        $('profileCard').classList.add('hidden');
        $('historyCard').classList.add('hidden');
        showMessage(text('noProfile'), true, 'noProfile');
        return;
      }

      localStorage.setItem('gdsq_v2_last_player_email', email);
      $('name').textContent = profile.displayName || profile.display_name || email.split('@')[0];
      $('profileEmail').textContent = email;
      const avatar = profile.avatarUrl || profile.avatar_url || '';
      $('avatar').src = avatar;
      $('avatar').classList.toggle('hidden', !avatar);
      $('initial').textContent = $('name').textContent.slice(0, 1).toUpperCase();
      $('initial').classList.toggle('hidden', Boolean(avatar));

      const events = await services.listEvents();
      const records = [];
      for (const event of events) {
        const [players, matches] = await Promise.all([services.listEventPlayers(event.id), services.listEventMatches(event.id)]);
        const eventPlayer = players.find((player) => String(player.playerId || player.player_id || '') === String(profile.id));
        if (!eventPlayer) continue;
        for (const match of matches.filter(isConfirmed)) {
          const teams = matchTeams(match);
          const side = teams.a.some((item) => itemId(item) === String(eventPlayer.id)) ? 'A' : teams.b.some((item) => itemId(item) === String(eventPlayer.id)) ? 'B' : '';
          if (side) records.push({ event, match, players, side });
        }
      }

      records.sort((a, b) => new Date(b.match.completedAt || b.match.completed_at || 0) - new Date(a.match.completedAt || a.match.completed_at || 0));
      const totals = records.reduce((total, record) => {
        const own = score(record.match, record.side);
        const other = score(record.match, record.side === 'A' ? 'B' : 'A');
        total.games += 1;
        total.wins += winner(record.match) === record.side ? 1 : 0;
        total.losses += winner(record.match) === record.side ? 0 : 1;
        total.pf += own;
        total.pa += other;
        return total;
      }, { games: 0, wins: 0, losses: 0, pf: 0, pa: 0 });

      const eventTotal = new Set(records.map((record) => record.event.id)).size;
      $('summary').innerHTML = [
        [text('games'), totals.games], ['W / L', `${totals.wins}/${totals.losses}`],
        [text('winRate'), totals.games ? `${Math.round(totals.wins / totals.games * 100)}%` : '-'],
        [text('pointDiff'), totals.pf - totals.pa], [text('events'), eventTotal]
      ].map(([label, value]) => `<div class="soft p-3 text-center mini">${label}<br><b class="mt-1 block text-xl text-white">${esc(value)}</b></div>`).join('');

      $('history').innerHTML = records.length ? records.map(({ event, match, players, side }) => {
        const teams = matchTeams(match);
        const won = winner(match) === side;
        const opponents = side === 'A' ? teams.b : teams.a;
        const names = opponents.map((item) => players.find((player) => String(player.id) === itemId(item))?.displayName || itemId(item)).join(' / ') || text('opponent');
        const own = score(match, side);
        const other = score(match, side === 'A' ? 'B' : 'A');
        return `<div class="soft p-4"><div class="flex items-start justify-between gap-3"><div><b>${won ? text('win') : text('loss')} ${esc(names)}</b><div class="mini mt-1">${esc(eventTitle(event))} · ${formatDate(match.completedAt || match.completed_at)}</div></div><b class="${won ? 'lime' : 'text-red-300'} text-xl">${own}-${other}</b></div></div>`;
      }).join('') : `<div class="soft p-4 mini">${text('noHistory')}</div>`;

      $('eventCount').textContent = `${eventTotal} ${text('events').toUpperCase()}`;
      $('profileCard').classList.remove('hidden');
      $('historyCard').classList.remove('hidden');
      showMessage(text('loaded'), false, 'loaded');
    }

    async function handleAuthAction() {
      const email = $('email').value.trim().toLowerCase();
      if (!/^\S+@\S+\.\S+$/.test(email)) return showMessage(text('invalidEmail'), true, 'invalidEmail');
      setBusy(true);
      try {
        if (services.mode !== 'supabase' || authPlayer) {
          await loadProfile();
        } else {
          const redirect = `${location.origin}${location.pathname}`;
          await services.sendPlayerSignInLink(email, redirect);
          localStorage.setItem('gdsq_v2_last_player_email', email);
          showMessage(text('sent'), false, 'sent');
        }
      } catch (error) {
        console.error('Profile action failed', error);
        showMessage(error.message || text('error'), true, error.message ? '' : 'error');
      } finally {
        setBusy(false);
      }
    }

    async function boot() {
      const mode = services.mode === 'supabase' ? 'supabase' : 'mock';
      $('joinLink').href = `./join.html?mode=${mode}`;
      $('email').value = localStorage.getItem('gdsq_v2_last_player_email') || '';
      authPlayer = await services.getAuthenticatedPlayer();
      if (authPlayer?.email) {
        $('email').value = authPlayer.email;
        $('email').readOnly = true;
        $('signOutBtn').classList.remove('hidden');
      }
      applyLanguage();
      if (authPlayer) await loadProfile();
    }

    $('languageBtn').addEventListener('click', () => {
      localStorage.setItem('gdsq_v2_ui_lang', language() === 'en' ? 'th' : 'en');
      applyLanguage();
    });
    $('authBtn').addEventListener('click', handleAuthAction);
    $('signOutBtn').addEventListener('click', async () => {
      setBusy(true);
      try {
        await services.signOutPlayer();
        authPlayer = null;
        $('email').readOnly = false;
        $('signOutBtn').classList.add('hidden');
        $('profileCard').classList.add('hidden');
        $('historyCard').classList.add('hidden');
        showMessage(text('signedOut'), false, 'signedOut');
      } catch (error) {
        showMessage(error.message || text('error'), true, error.message ? '' : 'error');
      } finally {
        setBusy(false);
      }
    });
    $('email').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        $('authBtn').click();
      }
    });

    boot().catch((error) => {
      console.error('Profile boot failed', error);
      showMessage(error.message || text('error'), true, error.message ? '' : 'error');
    });
  </script>
</body>
</html>
