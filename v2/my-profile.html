<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GDSQ My Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#10151b;color:#fff;font-family:system-ui,'Noto Sans Thai',sans-serif}.cut{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}.card{background:#222931;border:1px solid #39434d}.soft{background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.1);border-radius:12px}.lime{color:#c7ff2e}.bg-lime{background:#c7ff2e;color:#10151b}.btn{border:1px solid rgba(255,255,255,.15);font-weight:900}input{background:#10151b!important;color:#fff!important;border-color:#3a424a!important}.mini{font-size:12px;color:#94a3b8}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;border:1px solid rgba(199,255,46,.5);color:#c7ff2e;background:rgba(199,255,46,.14)}
  </style>
</head>
<body>
  <header class="sticky top-0 z-50 border-b border-white/10 bg-[#0d1217]/95 p-3"><div class="mx-auto flex max-w-2xl items-center justify-between gap-3"><div><div class="text-[10px] tracking-[.25em] lime">GDSQ PICKLEBALL</div><b>MY PROFILE</b></div><a class="cut btn bg-white/5 px-3 py-2 text-xs" href="./join.html?mode=mock">JOIN</a></div></header>
  <main class="mx-auto max-w-2xl p-4">
    <section class="cut card mt-4 p-5"><p class="text-xs font-black tracking-[.18em] lime">PLAYER HISTORY</p><h1 class="mt-1 text-3xl font-black">ประวัติผู้เล่นของฉัน</h1><p class="mini mt-2">กรอกอีเมลที่ใช้ลงทะเบียนเพื่อดูสถิติรวมจากทุกอีเว้นท์</p><div class="mt-4 grid gap-2 sm:grid-cols-[1fr_auto]"><input id="email" class="rounded-lg border p-4" type="email" placeholder="name@example.com" autocomplete="email"><button id="findBtn" class="cut bg-lime px-5 py-4 font-black">ดูประวัติ</button></div><div id="message" class="hidden mt-3 rounded-lg border p-3 text-sm"></div></section>
    <section id="profileCard" class="cut card mt-4 hidden p-5"><div class="flex items-center gap-3"><img id="avatar" class="hidden h-16 w-16 rounded-full border border-lime-300/40 object-cover" alt="Player profile"><div id="initial" class="flex h-16 w-16 items-center justify-center rounded-full bg-slate-700 text-xl font-black"></div><div><h2 id="name" class="text-2xl font-black lime">-</h2><p id="profileEmail" class="mini">-</p><span class="pill mt-2">REGISTERED PLAYER</span></div></div><div id="summary" class="mt-5 grid grid-cols-2 gap-2 md:grid-cols-5"></div></section>
    <section id="historyCard" class="cut card mt-4 hidden p-5"><div class="flex items-center justify-between gap-3"><div><h2 class="text-2xl font-black lime">MATCH HISTORY</h2><p class="mini mt-1">เฉพาะแมตช์ที่ยืนยันผลแล้ว</p></div><b id="eventCount" class="text-sm"></b></div><div id="history" class="mt-4 grid gap-3"></div></section>
  </main>
  <script type="module">
    import { createV2Services } from './src/services/index.js?v=my-profile-02';
    const $=(id)=>document.getElementById(id);const services=createV2Services();
    const profileLanguage=()=>localStorage.getItem('gdsq_v2_ui_lang')==='en'?'en':'th';
    const profileText=(key)=>({games:profileLanguage()==='en'?'Games':'เกม',winRate:profileLanguage()==='en'?'Win rate':'อัตราชนะ',pointDiff:profileLanguage()==='en'?'Point diff':'ผลต่างคะแนน',events:profileLanguage()==='en'?'Events':'อีเว้นท์',win:profileLanguage()==='en'?'Won':'ชนะ',loss:profileLanguage()==='en'?'Lost':'แพ้',opponent:profileLanguage()==='en'?'Opponent':'คู่แข่ง',noHistory:profileLanguage()==='en'?'No confirmed matches in your overall history yet.':'ยังไม่มีแมตช์ที่ยืนยันผลในประวัติรวม',loaded:profileLanguage()==='en'?'Player history loaded.':'โหลดประวัติผู้เล่นแล้ว'})[key]||key;
    function applyProfileLanguage(){const en=profileLanguage()==='en',text=en?{title:'MY PROFILE',join:'JOIN',kicker:'PLAYER HISTORY',heading:'My player history',intro:'Enter the email used when registering to see statistics across every event.',find:'View history',registered:'REGISTERED PLAYER',history:'MATCH HISTORY',historyInfo:'Confirmed matches only',event:'EVENTS'}:{title:'โปรไฟล์ของฉัน',join:'เข้าร่วม',kicker:'ประวัติผู้เล่น',heading:'ประวัติผู้เล่นของฉัน',intro:'กรอกอีเมลที่ใช้ลงทะเบียนเพื่อดูสถิติรวมจากทุกอีเว้นท์',find:'ดูประวัติ',registered:'ผู้เล่นที่ลงทะเบียน',history:'ประวัติการแข่งขัน',historyInfo:'เฉพาะแมตช์ที่ยืนยันผลแล้ว',event:'อีเว้นท์'};document.documentElement.lang=profileLanguage();document.querySelector('header b').textContent=text.title;document.querySelector('header a').textContent=text.join;const toggle=$('profileLanguageToggle');if(toggle){toggle.textContent=en?'EN':'TH';toggle.setAttribute('aria-label',en?'Switch to Thai':'เปลี่ยนเป็นภาษาอังกฤษ');}document.querySelector('main > section:first-child p').textContent=text.kicker;document.querySelector('main > section:first-child h1').textContent=text.heading;document.querySelector('main > section:first-child h1 + p').textContent=text.intro;$('findBtn').textContent=text.find;document.querySelector('#profileCard .pill').textContent=text.registered;document.querySelector('#historyCard h2').textContent=text.history;document.querySelector('#historyCard h2 + p').textContent=text.historyInfo;const count=$('eventCount');if(count)count.dataset.label=text.event;}
    function ensureProfileLanguageToggle(){if($('profileLanguageToggle'))return;const button=document.createElement('button');button.id='profileLanguageToggle';button.className='cut btn bg-white/5 px-3 py-2 text-xs';document.querySelector('header .max-w-2xl').append(button);button.addEventListener('click',()=>{localStorage.setItem('gdsq_v2_ui_lang',profileLanguage()==='en'?'th':'en');applyProfileLanguage();});}
    const esc=(value)=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const eventTitle=(event)=>event?.name||event?.name_th||event?.name_en||'Untitled Event';
    const itemId=(item)=>String(typeof item==='string'?item:(item?.id||item?.eventPlayerId||item?.event_player_id||''));
    const matchTeams=(match)=>({a:match.teamA||match.team_a||[],b:match.teamB||match.team_b||[]});
    const score=(match,side)=>Number(side==='A'?(match.teamAScore??match.team_a_score??0):(match.teamBScore??match.team_b_score??0));
    const winner=(match)=>String(match.winner||'').toUpperCase();
    const isConfirmed=(match)=>['confirmed','completed'].includes(String(match.status||'').toLowerCase());
    function showMessage(text,error=false){const box=$('message');box.textContent=text;box.className=`mt-3 rounded-lg border p-3 text-sm ${error?'border-red-300/40 bg-red-300/10 text-red-100':'border-lime-300/40 bg-lime-300/10 text-lime-100'}`;}
    function formatDate(value){const date=new Date(value||'');return Number.isNaN(date.getTime())?'-':date.toLocaleDateString(profileLanguage()==='en'?'en-US':'th-TH',{day:'2-digit',month:'short',year:'numeric'});}
    async function loadProfile(){const email=$('email').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return showMessage(profileLanguage()==='en'?'Enter the email used for registration.':'กรุณาใส่อีเมลที่ใช้ลงทะเบียน',true);const profile=await services.findPlayerProfileByEmail(email);if(!profile){$('profileCard').classList.add('hidden');$('historyCard').classList.add('hidden');return showMessage(profileLanguage()==='en'?'No profile found for this email yet.':'ยังไม่พบโปรไฟล์นี้ ลองลงทะเบียนด้วยอีเมลนี้ก่อน',true);}localStorage.setItem('gdsq_v2_last_player_email',email);$('name').textContent=profile.displayName||profile.display_name||email.split('@')[0];$('profileEmail').textContent=email;const avatar=profile.avatarUrl||profile.avatar_url||'';$('avatar').src=avatar;$('avatar').classList.toggle('hidden',!avatar);$('initial').textContent=$('name').textContent.slice(0,1).toUpperCase();$('initial').classList.toggle('hidden',!!avatar);const events=await services.listEvents();const records=[];for(const event of events){const [players,matches]=await Promise.all([services.listEventPlayers(event.id),services.listEventMatches(event.id)]);const eventPlayer=players.find(player=>String(player.playerId||player.player_id||'')===String(profile.id));if(!eventPlayer)continue;for(const match of matches.filter(isConfirmed)){const teams=matchTeams(match);const side=teams.a.some(item=>itemId(item)===String(eventPlayer.id))?'A':teams.b.some(item=>itemId(item)===String(eventPlayer.id))?'B':'';if(!side)continue;records.push({event,match,players,side});}}records.sort((x,y)=>new Date(y.match.completedAt||y.match.completed_at||0)-new Date(x.match.completedAt||x.match.completed_at||0));const totals=records.reduce((total,record)=>{const own=score(record.match,record.side),other=score(record.match,record.side==='A'?'B':'A');total.games+=1;total.wins+=winner(record.match)===record.side?1:0;total.losses+=winner(record.match)===record.side?0:1;total.pf+=own;total.pa+=other;return total;},{games:0,wins:0,losses:0,pf:0,pa:0});$('summary').innerHTML=[[profileText('games'),totals.games],['W / L',`${totals.wins}/${totals.losses}`],[profileText('winRate'),totals.games?`${Math.round(totals.wins/totals.games*100)}%`:'-'],[profileText('pointDiff'),totals.pf-totals.pa],[profileText('events'),new Set(records.map(record=>record.event.id)).size]].map(([label,value])=>`<div class="soft p-3 text-center mini">${label}<br><b class="mt-1 block text-xl text-white">${esc(value)}</b></div>`).join('');$('history').innerHTML=records.length?records.map(({event,match,players,side})=>{const teams=matchTeams(match),won=winner(match)===side,opponents=side==='A'?teams.b:teams.a;const names=opponents.map(item=>players.find(player=>String(player.id)===itemId(item))?.displayName||players.find(player=>String(player.id)===itemId(item))?.name||itemId(item)).join(' / ')||profileText('opponent');const own=score(match,side),other=score(match,side==='A'?'B':'A');return`<div class="soft p-4"><div class="flex items-start justify-between gap-3"><div><b>${won?profileText('win'):profileText('loss')} ${esc(names)}</b><div class="mini mt-1">${esc(eventTitle(event))} · ${formatDate(match.completedAt||match.completed_at)}</div></div><b class="${won?'lime':'text-red-300'} text-xl">${own}-${other}</b></div></div>`}).join(''):`<div class="soft p-4 mini">${profileText('noHistory')}</div>`;$('eventCount').textContent=`${new Set(records.map(record=>record.event.id)).size} ${profileText('events').toUpperCase()}`;$('profileCard').classList.remove('hidden');$('historyCard').classList.remove('hidden');showMessage(profileText('loaded'));}
    ensureProfileLanguageToggle();document.querySelector('header a').href=`./join.html?mode=${new URLSearchParams(location.search).get('mode')==='supabase'?'supabase':'mock'}`;applyProfileLanguage();$('email').value=localStorage.getItem('gdsq_v2_last_player_email')||'';$('findBtn').addEventListener('click',()=>loadProfile().catch(error=>showMessage(error.message||'โหลดประวัติไม่สำเร็จ',true)));$('email').addEventListener('keydown',event=>{if(event.key==='Enter')$('findBtn').click()});if($('email').value)$('findBtn').click();
  </script>
</body>
</html>
