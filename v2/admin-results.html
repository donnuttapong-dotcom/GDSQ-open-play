<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GDSQ Results Editor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#09111c;color:#f8fafc;font-family:system-ui,'Noto Sans Thai',sans-serif}.cut{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}.card{background:#111d2b;border:1px solid #29405a}.soft{background:#0b1624;border:1px solid #26384c}.lime{color:#c7ff2e}.bg-lime{background:#c7ff2e;color:#09111c}.btn{min-height:44px;border:1px solid #385069;font-weight:800}.input{background:#07101a;border:1px solid #385069;color:#fff;min-height:44px}.mini{font-size:12px;color:#94a3b8}
  </style>
</head>
<body>
  <header class="sticky top-0 z-10 border-b border-white/10 bg-[#09111c]/95 p-3"><div class="mx-auto flex max-w-5xl items-center justify-between gap-3"><div><div class="text-[10px] font-black tracking-[.22em] lime">GDSQ OPEN PLAY</div><h1 class="text-lg font-black">RESULTS EDITOR</h1></div><a class="cut btn px-4 py-2 text-sm" href="./openplay.html?mode=supabase">Open Play</a></div></header>
  <main class="mx-auto max-w-5xl space-y-4 p-4 pb-10">
    <section id="signInCard" class="cut card p-5"><h2 class="text-xl font-black">เข้าสู่ระบบเพื่อแก้ผลการแข่งขัน</h2><p class="mini mt-1">กรอกอีเมลที่ลงทะเบียนไว้ ระบบจะส่งลิงก์ยืนยันไปยังอีเมลนั้น</p><div class="mt-4 flex flex-col gap-2 sm:flex-row"><input id="email" class="input w-full rounded-lg px-3" type="email" autocomplete="email" placeholder="name@example.com" /><button id="sendLink" class="cut bg-lime btn px-5">ส่งลิงก์เข้าสู่ระบบ</button></div></section>
    <section id="editor" class="hidden space-y-4"><div class="cut card p-5"><div class="flex flex-wrap items-end justify-between gap-3"><div><h2 class="text-xl font-black">แก้ไขผลคะแนน</h2><p id="signedInAs" class="mini mt-1"></p></div><button id="signOut" class="cut btn bg-white/5 px-4">ออกจากระบบ</button></div><label class="mt-4 block text-sm font-bold">เลือกอีเวนต์<select id="eventSelect" class="input mt-1 w-full rounded-lg px-3"></select></label></div><section class="cut card p-5"><div class="flex items-center justify-between gap-3"><div><h3 class="font-black lime">ผลการแข่งขันที่ยืนยันแล้ว</h3><p class="mini">แก้เฉพาะคะแนนเท่านั้น ไม่มีปุ่มลบประวัติ</p></div><button id="refresh" class="cut btn bg-white/5 px-4">รีเฟรช</button></div><div id="message" class="hidden mt-4 rounded-lg border p-3 text-sm"></div><div id="matches" class="mt-4 grid gap-3"></div></section></section>
  </main>
  <script type="module">
    import { createV2Services } from './src/services/index.js?v=results-editor-01';
    const $=id=>document.getElementById(id),services=createV2Services({mode:'supabase'});let events=[],selectedEvent=null,playerNames=new Map();
    const esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    function show(text,ok=true){const node=$('message');node.textContent=text;node.className=`mt-4 rounded-lg border p-3 text-sm ${ok?'border-lime-300/40 bg-lime-300/10 text-lime-100':'border-red-300/40 bg-red-300/10 text-red-100'}`;}
    function matchName(match,team){const field=team==='A'?'teamA':'teamB';return (match[field]||[]).map(item=>{const id=item?.id||item?.eventPlayerId||item?.event_player_id||item;return item?.displayName||item?.display_name||item?.nickname||playerNames.get(String(id))||id;}).join(' / ')||'-';}
    function valid(a,b){return Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&b>=0&&a<=99&&b<=99&&a!==b;}
    async function loadMatches(){if(!selectedEvent)return;$('matches').innerHTML='<p class="mini">กำลังโหลด...</p>';try{const [eventPlayers,allMatches]=await Promise.all([services.listEventPlayers(selectedEvent.id),services.listEventMatches(selectedEvent.id)]);playerNames=new Map(eventPlayers.map(player=>[String(player.id),player.displayName||player.display_name||player.nickname||'Player']));const rows=allMatches.filter(match=>String(match.status).toLowerCase()==='confirmed');$('matches').innerHTML=rows.length?rows.map(match=>`<article class="soft p-4"><div class="flex flex-wrap items-start justify-between gap-3"><div><b>${esc(match.courtName||'Court -')}</b><div class="mini mt-1">${esc(matchName(match,'A'))} vs ${esc(matchName(match,'B'))}</div></div><span class="mini">${new Date(match.completedAt||match.updatedAt||Date.now()).toLocaleString()}</span></div><div class="mt-3 grid grid-cols-[1fr_auto_1fr_auto] items-center gap-2 sm:max-w-md"><input class="input min-w-0 rounded-lg px-3 text-center font-black" aria-label="Team A score" data-score-a="${match.id}" type="number" min="0" max="99" value="${Number(match.teamAScore)}"><span class="font-black">:</span><input class="input min-w-0 rounded-lg px-3 text-center font-black" aria-label="Team B score" data-score-b="${match.id}" type="number" min="0" max="99" value="${Number(match.teamBScore)}"><button class="cut bg-lime btn px-4" data-save="${match.id}">บันทึก</button></div></article>`).join(''):'<p class="mini">ยังไม่มีผลการแข่งขันที่ยืนยันแล้ว</p>';}catch(error){show(`โหลดผลการแข่งขันไม่สำเร็จ: ${error.message||error}`,false);}}
    async function loadEvents(){events=await services.listEvents();$('eventSelect').innerHTML=events.map(event=>`<option value="${event.id}">${esc(event.name||'Untitled Event')}</option>`).join('');selectedEvent=events[0]||null;if(selectedEvent)$('eventSelect').value=selectedEvent.id;await loadMatches();}
    async function boot(){const user=await services.getAuthenticatedPlayer();if(!user){$('signInCard').classList.remove('hidden');return;}$('signInCard').classList.add('hidden');$('editor').classList.remove('hidden');$('signedInAs').textContent=`Signed in as ${user.email}`;await loadEvents();}
    $('sendLink').addEventListener('click',async()=>{const email=$('email').value.trim();if(!/^\S+@\S+\.\S+$/.test(email))return alert('กรุณากรอกอีเมลให้ถูกต้อง');try{await services.sendPlayerSignInLink(email,location.href);alert('ส่งลิงก์เข้าสู่ระบบแล้ว กรุณาเปิดอีเมลและกดยืนยัน');}catch(error){alert(error.message||'ส่งลิงก์ไม่สำเร็จ');}});
    $('eventSelect').addEventListener('change',async event=>{selectedEvent=events.find(item=>String(item.id)===String(event.target.value))||null;await loadMatches();});$('refresh').addEventListener('click',loadMatches);$('signOut').addEventListener('click',async()=>{await services.signOutPlayer();location.reload();});$('matches').addEventListener('click',async event=>{const button=event.target.closest('[data-save]');if(!button)return;const id=button.dataset.save,a=Number(document.querySelector(`[data-score-a="${id}"]`).value),b=Number(document.querySelector(`[data-score-b="${id}"]`).value);if(!valid(a,b))return show('คะแนนต้องเป็นจำนวนเต็ม 0-99 และห้ามเท่ากัน',false);if(!confirm(`ยืนยันแก้ผลเป็น ${a} : ${b} ?`))return;button.disabled=true;try{await services.updateConfirmedScore(id,{eventId:selectedEvent.id,teamAScore:a,teamBScore:b});show('บันทึกคะแนนแล้ว สถิติใน Open Play จะอัปเดตจากผลใหม่นี้');await loadMatches();}catch(error){show(`บันทึกไม่สำเร็จ: ${error.message||error}`,false);button.disabled=false;}});boot().catch(error=>show(error.message||'เปิดหน้าแก้ผลไม่สำเร็จ',false));
  </script>
</body>
</html>
