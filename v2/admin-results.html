<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GDSQ Results Editor</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,'Noto Sans Thai',sans-serif;background:#09111c;color:#f8fafc}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:2;border-bottom:1px solid #29405a;background:#09111cf2}.bar,main{max-width:960px;margin:auto}.bar{min-height:70px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand small{display:block;color:#c7ff2e;font-weight:900;letter-spacing:.14em;font-size:10px}.brand b{font-size:18px}.actions{display:flex;gap:8px;align-items:center}.cut{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}button,a{font:inherit}button{cursor:pointer}.btn{min-height:44px;border:1px solid #385069;background:#111d2b;color:#f8fafc;padding:9px 14px;font-weight:800;text-decoration:none;display:inline-grid;place-items:center}.primary{background:#c7ff2e;color:#09111c;border-color:#c7ff2e}.card{background:#111d2b;border:1px solid #29405a;padding:20px}.soft{background:#0b1624;border:1px solid #26384c;padding:16px}.lime{color:#c7ff2e}.muted{font-size:13px;color:#a8b6c8;line-height:1.45}.hidden{display:none!important}main{padding:18px 16px 48px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}.field{display:grid;gap:6px;font-size:13px;font-weight:700}.input{width:100%;min-height:44px;padding:10px 12px;border:1px solid #385069;border-radius:6px;background:#07101a;color:#fff;font:inherit}.entry{display:grid;gap:12px}.match-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.score{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;max-width:410px}.score input{text-align:center;font-size:18px;font-weight:900}.message{margin-top:14px;padding:12px;border:1px solid #9bdb2d;background:#c7ff2e18;color:#e8ffc1}.message.error{border-color:#fb7185;background:#fb718518;color:#fecdd3}@media(max-width:560px){.bar{align-items:start}.actions{flex-wrap:wrap;justify-content:end}.card{padding:16px}.score{max-width:none;grid-template-columns:1fr auto 1fr}.score button{grid-column:1/-1}.match-head time{font-size:11px;text-align:right}}
  </style>
</head>
<body>
  <header class="top"><div class="bar"><div class="brand"><small>GDSQ OPEN PLAY</small><b id="pageTitle">RESULTS EDITOR</b></div><div class="actions"><button id="languageToggle" class="cut btn" type="button">EN</button><a id="openPlayLink" class="cut btn" href="./openplay.html?mode=supabase">Open Play</a></div></div></header>
  <main>
    <section id="unlockCard" class="cut card"><h1 id="unlockTitle" class="lime">แก้ไขผลการแข่งขัน</h1><p id="unlockDescription" class="muted">ใส่รหัส Admin เพื่อเปิดหน้าแก้คะแนน ไม่มีการส่งอีเมล และรหัสจะถูกตรวจบน server ตอนบันทึกผล</p><div class="row" style="margin-top:16px"><label class="field" style="flex:1;min-width:220px"><span id="passcodeLabel">รหัส Admin</span><input id="passcode" class="input" type="password" autocomplete="current-password" minlength="6" placeholder="••••••••" /></label><button id="unlock" class="cut btn primary">เปิดหน้าแก้คะแนน</button></div><div id="unlockMessage" class="hidden message"></div></section>
    <section id="editor" class="hidden"><div class="cut card"><div class="row"><div><h1 id="editorTitle" class="lime">แก้ไขผลคะแนน</h1><p id="editorDescription" class="muted">แก้ได้เฉพาะคะแนนของแมตช์ที่ยืนยันแล้ว ไม่มีปุ่มลบประวัติ</p></div><button id="lock" class="cut btn">ล็อกหน้า</button></div><label class="field" style="margin-top:16px"><span id="eventLabel">เลือกอีเวนต์</span><select id="eventSelect" class="input"></select></label></div><section class="cut card" style="margin-top:16px"><div class="row"><div><h2 id="matchesTitle">ผลการแข่งขันที่ยืนยันแล้ว</h2><p id="matchesDescription" class="muted">แก้เฉพาะคะแนนเท่านั้น ไม่มีปุ่มลบประวัติ</p></div><button id="refresh" class="cut btn">รีเฟรช</button></div><div id="message" class="hidden message"></div><div id="matches" class="entry" style="margin-top:16px"></div></section></section>
  </main>
  <script type="module">
    import { createV2Services } from './src/services/index.js?v=admin-passcode-01';
    import { getSupabaseClient } from './src/services/supabaseClient.js?v=admin-passcode-01';
    const $=id=>document.getElementById(id),LANG_KEY='gdsq_v2_ui_lang',services=createV2Services({mode:'supabase'}),supabase=getSupabaseClient();
    const copy={th:{title:'RESULTS EDITOR',open:'Open Play',unlock:'แก้ไขผลการแข่งขัน',unlockDescription:'ใส่รหัส Admin เพื่อเปิดหน้าแก้คะแนน ไม่มีการส่งอีเมล และรหัสจะถูกตรวจบน server ตอนบันทึกผล',passcode:'รหัส Admin',openEditor:'เปิดหน้าแก้คะแนน',editor:'แก้ไขผลคะแนน',editorDescription:'แก้ได้เฉพาะคะแนนของแมตช์ที่ยืนยันแล้ว ไม่มีปุ่มลบประวัติ',lock:'ล็อกหน้า',event:'เลือกอีเวนต์',confirmed:'ผลการแข่งขันที่ยืนยันแล้ว',note:'แก้เฉพาะคะแนนเท่านั้น ไม่มีปุ่มลบประวัติ',refresh:'รีเฟรช',loading:'กำลังโหลด...',empty:'ยังไม่มีผลการแข่งขันที่ยืนยันแล้ว',court:'คอร์ท',save:'บันทึก',passcodeError:'กรอกรหัส Admin อย่างน้อย 6 ตัวอักษร',invalidPasscode:'รหัส Admin ไม่ถูกต้อง',scoreError:'คะแนนต้องเป็นจำนวนเต็ม 0-99 และห้ามเท่ากัน',confirm:'ยืนยันแก้ผลเป็น',saved:'บันทึกคะแนนแล้ว สถิติใน Open Play จะอัปเดตจากผลใหม่นี้',loadError:'โหลดผลการแข่งขันไม่สำเร็จ',saveError:'บันทึกไม่สำเร็จ ตรวจรหัส Admin แล้วลองใหม่',bootError:'เปิดหน้าแก้ผลไม่สำเร็จ'},en:{title:'RESULTS EDITOR',open:'Open Play',unlock:'Edit match results',unlockDescription:'Enter the Admin passcode to open score editing. No email is required; the server checks the passcode before saving.',passcode:'Admin passcode',openEditor:'Open score editor',editor:'Edit match results',editorDescription:'Only confirmed match scores can be edited. Match history cannot be deleted here.',lock:'Lock editor',event:'Select event',confirmed:'Confirmed matches',note:'Scores only. Match history cannot be deleted here.',refresh:'Refresh',loading:'Loading...',empty:'No confirmed matches yet.',court:'Court',save:'Save',passcodeError:'Enter an Admin passcode with at least 6 characters.',invalidPasscode:'Invalid Admin passcode.',scoreError:'Scores must be whole numbers from 0 to 99 and cannot be tied.',confirm:'Confirm score change to',saved:'Score saved. Open Play statistics now use the new result.',loadError:'Could not load match results',saveError:'Could not save score. Check the Admin passcode and try again.',bootError:'Could not open the results editor'}};
    let events=[],selectedEvent=null,playerNames=new Map(),adminPasscode='';
    const lang=()=>localStorage.getItem(LANG_KEY)==='en'?'en':'th',t=key=>copy[lang()][key]||key,esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    function setText(id,key){$(id).textContent=t(key)}
    function applyLanguage(){document.documentElement.lang=lang();setText('pageTitle','title');setText('openPlayLink','open');setText('unlockTitle','unlock');setText('unlockDescription','unlockDescription');setText('passcodeLabel','passcode');setText('unlock','openEditor');setText('editorTitle','editor');setText('editorDescription','editorDescription');setText('lock','lock');setText('eventLabel','event');setText('matchesTitle','confirmed');setText('matchesDescription','note');setText('refresh','refresh');$('languageToggle').textContent=lang()==='th'?'EN':'TH';$('languageToggle').setAttribute('aria-label',lang()==='th'?'Switch to English':'เปลี่ยนเป็นภาษาไทย');}
    function show(text,ok=true,target='message'){const node=$(target);node.textContent=text;node.className=`message${ok?'':' error'}`;}
    async function callAdmin(action,payload={}){if(!supabase)throw new Error('Supabase is not configured');const {data,error}=await supabase.functions.invoke('v2-admin-results',{body:{action,passcode:adminPasscode,...payload}});if(error)throw error;if(!data?.ok)throw new Error(data?.error||t('saveError'));return data;}
    function matchName(match,team){const field=team==='A'?'teamA':'teamB';return (match[field]||[]).map(item=>{const id=item?.id||item?.eventPlayerId||item?.event_player_id||item;return item?.displayName||item?.display_name||item?.nickname||playerNames.get(String(id))||id;}).join(' / ')||'-';}
    function valid(a,b){return Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&b>=0&&a<=99&&b<=99&&a!==b;}
    function renderMatches(rows){$('matches').innerHTML=rows.length?rows.map(match=>`<article class="soft"><div class="match-head"><div><b>${esc(match.courtName||`${t('court')} -`)}</b><div class="muted" style="margin-top:5px">${esc(matchName(match,'A'))} vs ${esc(matchName(match,'B'))}</div></div><time class="muted">${new Date(match.completedAt||match.updatedAt||Date.now()).toLocaleString()}</time></div><div class="score" style="margin-top:14px"><input class="input" aria-label="Team A score" data-score-a="${match.id}" type="number" min="0" max="99" value="${Number(match.teamAScore)}"><b>:</b><input class="input" aria-label="Team B score" data-score-b="${match.id}" type="number" min="0" max="99" value="${Number(match.teamBScore)}"><button class="cut btn primary" data-save="${match.id}">${t('save')}</button></div></article>`).join(''):`<p class="muted">${t('empty')}</p>`;}
    async function loadMatches(){if(!selectedEvent)return;$('matches').innerHTML=`<p class="muted">${t('loading')}</p>`;try{const [eventPlayers,allMatches]=await Promise.all([services.listEventPlayers(selectedEvent.id),services.listEventMatches(selectedEvent.id)]);playerNames=new Map(eventPlayers.map(player=>[String(player.id),player.displayName||player.display_name||player.nickname||'Player']));renderMatches(allMatches.filter(match=>String(match.status).toLowerCase()==='confirmed'));}catch(error){show(`${t('loadError')}: ${error.message||error}`,false);}}
    async function loadEvents(){events=await services.listEvents();$('eventSelect').innerHTML=events.map(event=>`<option value="${event.id}">${esc(event.name||'Untitled Event')}</option>`).join('');selectedEvent=events[0]||null;if(selectedEvent)$('eventSelect').value=selectedEvent.id;await loadMatches();}
    async function openEditor(){adminPasscode=$('passcode').value;if(adminPasscode.length<6)return show(t('passcodeError'),false,'unlockMessage');await callAdmin('verify');$('unlockCard').classList.add('hidden');$('editor').classList.remove('hidden');await loadEvents();}
    function lockEditor(){adminPasscode='';$('passcode').value='';$('editor').classList.add('hidden');$('unlockCard').classList.remove('hidden');}
    async function boot(){applyLanguage();}
    $('languageToggle').addEventListener('click',()=>{localStorage.setItem(LANG_KEY,lang()==='th'?'en':'th');applyLanguage();if(selectedEvent)loadMatches();});
    $('unlock').addEventListener('click',()=>openEditor().catch(error=>show(error.message||t('invalidPasscode'),false,'unlockMessage')));$('passcode').addEventListener('keydown',event=>{if(event.key==='Enter')openEditor().catch(error=>show(error.message||t('invalidPasscode'),false,'unlockMessage'))});
    $('eventSelect').addEventListener('change',async event=>{selectedEvent=events.find(item=>String(item.id)===String(event.target.value))||null;await loadMatches();});$('refresh').addEventListener('click',loadMatches);$('lock').addEventListener('click',lockEditor);
    $('matches').addEventListener('click',async event=>{const button=event.target.closest('[data-save]');if(!button)return;const id=button.dataset.save,a=Number(document.querySelector(`[data-score-a="${id}"]`).value),b=Number(document.querySelector(`[data-score-b="${id}"]`).value);if(!valid(a,b))return show(t('scoreError'),false);if(!confirm(`${t('confirm')} ${a} : ${b}?`))return;button.disabled=true;try{await callAdmin('updateScore',{matchId:id,teamAScore:a,teamBScore:b});show(t('saved'));await loadMatches();}catch(error){show(`${t('saveError')}: ${error.message||error}`,false);button.disabled=false;}});boot().catch(error=>show(error.message||t('bootError'),false));
  </script>
</body>
</html>
