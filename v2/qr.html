<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>GDSQ Event QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--lime:#c7ff2e;--bg:#071018;--card:#111c26;--line:#324151;--muted:#9aa9b8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:#fff;font-family:Inter,system-ui,'Noto Sans Thai',sans-serif}.cut{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}.card{background:var(--card);border:1px solid var(--line)}.lime{color:var(--lime)}.btn{min-height:46px;border:1px solid rgba(255,255,255,.16);font-weight:900}.primary{background:var(--lime);color:#071018}.muted{color:var(--muted)}select,input{min-height:48px;background:#071018!important;color:#fff!important;border:1px solid #3b4b59;border-radius:8px}.qr{width:min(56vh,78vw,440px);height:min(56vh,78vw,440px);object-fit:contain;background:#fff;padding:14px;border-radius:8px}.pill{display:inline-flex;border:1px solid rgba(199,255,46,.45);border-radius:999px;padding:7px 11px;color:var(--lime);background:rgba(199,255,46,.1);font-size:11px;font-weight:900}@media(min-width:900px){.layout{grid-template-columns:minmax(360px,520px) minmax(320px,1fr)}}
  </style>
</head>
<body>
  <header class="border-b border-white/10 p-3"><div class="mx-auto flex max-w-6xl items-center justify-between gap-3"><div><div class="text-[10px] tracking-[.24em] lime">GDSQ PICKLEBALL</div><b>EVENT QR</b></div><div class="flex gap-2"><a id="organizerLink" class="cut btn bg-white/5 px-4 py-3 text-sm" href="./openplay.html?mode=supabase">ผู้จัด</a><button id="languageBtn" class="cut btn bg-white/5 px-3 text-xs" type="button">EN</button></div></div></header>
  <main class="layout mx-auto grid max-w-6xl gap-4 p-4">
    <section class="cut card flex min-h-[560px] flex-col items-center justify-center p-5 text-center"><span id="status" class="pill">CHECKING</span><h1 id="eventName" class="mt-4 text-3xl font-black md:text-5xl">GDSQ Open Play</h1><p id="scanText" class="mt-2 text-lg font-black lime">สแกนเพื่อลงทะเบียนและเข้าร่วม</p><img id="qr" class="qr mt-5" alt="Event registration QR"><p id="qrError" class="mt-3 hidden text-sm text-amber-300">ไม่สามารถโหลดภาพ QR ได้ กรุณาใช้ลิงก์โดยตรง</p></section>
    <section class="cut card self-center p-5"><label class="text-xs font-black muted"><span id="eventLabel">อีเวนต์ LIVE</span><select id="eventSelect" class="mt-2 w-full p-3"></select></label><div id="details" class="mt-4 grid grid-cols-2 gap-2"></div><label class="mt-4 block text-xs font-black muted"><span id="urlLabel">ลิงก์เข้าร่วมโดยตรง</span><input id="joinUrl" class="mt-2 w-full p-3 text-xs" readonly></label><div class="mt-3 grid grid-cols-2 gap-2"><button id="copyBtn" class="cut primary px-4 py-3 font-black" type="button">คัดลอกลิงก์</button><a id="openBtn" class="cut btn bg-white/5 px-4 py-3 text-center" href="#" target="_blank" rel="noopener">เปิดหน้าลงทะเบียน</a></div><div id="message" class="mt-3 hidden rounded-lg border p-3 text-sm"></div></section>
  </main>
  <script type="module">
    import { createV2Services } from './src/services/index.js?v=verified-identity-01';
    const $=id=>document.getElementById(id),services=createV2Services({mode:'supabase'});let events=[];const lang=()=>localStorage.getItem('gdsq_v2_ui_lang')==='en'?'en':'th',words={th:{organizer:'ผู้จัด',scan:'สแกนเพื่อลงทะเบียนและเข้าร่วม',event:'อีเวนต์ LIVE',url:'ลิงก์เข้าร่วมโดยตรง',copy:'คัดลอกลิงก์',open:'เปิดหน้าลงทะเบียน',copied:'คัดลอกลิงก์แล้ว',selected:'เลือกลิงก์แล้ว',empty:'ยังไม่มีอีเวนต์ LIVE ที่เปิดรับลงทะเบียน',noLive:'ไม่มีอีเวนต์ LIVE',qrError:'ไม่สามารถโหลดภาพ QR ได้ กรุณาใช้ลิงก์โดยตรง',date:'วันที่',time:'เวลา',venue:'สถานที่',status:'สถานะ'},en:{organizer:'Organizer',scan:'Scan to register & join',event:'LIVE EVENT',url:'DIRECT JOIN URL',copy:'COPY LINK',open:'OPEN JOIN',copied:'Join link copied.',selected:'Join link selected.',empty:'No open event is available.',noLive:'NO LIVE EVENT',qrError:'QR image unavailable. Use the direct link.',date:'DATE',time:'TIME',venue:'VENUE',status:'STATUS'}},t=key=>words[lang()][key]||key;
    const params=()=>new URLSearchParams(location.search),title=e=>e?.name||'GDSQ Open Play',isOpen=e=>['live','open','active'].includes(String(e?.status||'').toLowerCase())&&e?.checkin_open!==false&&e?.checkinOpen!==false;
    function joinLink(id){const url=new URL('./join-qr.html',location.href);url.searchParams.set('event',id);url.searchParams.set('mode','supabase');url.searchParams.set('v','verified-join-01');return url.toString()}
    function selected(){return events.find(e=>String(e.id)===String($('eventSelect').value))||null}
    function show(text,error=false){const box=$('message');box.textContent=text;box.className=`mt-3 rounded-lg border p-3 text-sm ${error?'border-red-300/40 bg-red-300/10':'border-lime-300/40 bg-lime-300/10'}`}
    function applyLanguage(){$('languageBtn').textContent=lang()==='th'?'EN':'TH';$('organizerLink').textContent=t('organizer');$('scanText').textContent=t('scan');$('eventLabel').textContent=t('event');$('urlLabel').textContent=t('url');$('copyBtn').textContent=t('copy');$('openBtn').textContent=t('open');$('qrError').textContent=t('qrError');if(events.length)render();else if($('eventSelect').disabled){$('status').textContent=t('noLive');show(t('empty'),true)}}
    function render(){const event=selected();if(!event)return;const link=joinLink(event.id),status=String(event.status||'draft').toUpperCase();$('eventName').textContent=title(event);$('status').textContent=status;$('joinUrl').value=link;$('openBtn').href=link;$('details').innerHTML=[[event.eventDate||event.event_date||'-',t('date')],[`${event.startTime||event.start_time||'-'} - ${event.endTime||event.end_time||'-'}`,t('time')],[event.venueName||event.venue_name||'-',t('venue')],[status,t('status')]].map(([value,label])=>`<div class="rounded-lg border border-white/10 bg-black/20 p-3"><div class="text-[10px] muted">${label}</div><b>${value}</b></div>`).join('');$('qrError').classList.add('hidden');$('qr').classList.remove('hidden');$('qr').src=`https://quickchart.io/qr?size=700&margin=2&text=${encodeURIComponent(link)}`;$('copyBtn').disabled=false;$('openBtn').removeAttribute('aria-disabled');const page=new URL(location.href);page.searchParams.set('event',event.id);page.searchParams.set('mode','supabase');history.replaceState(null,'',page)}
    async function copy(){const value=$('joinUrl').value;if(!value)return;try{await navigator.clipboard.writeText(value);show(t('copied'))}catch{const input=$('joinUrl');input.focus();input.select();document.execCommand('copy');show(t('selected'))}}
    async function boot(){events=(await services.listEvents()).filter(isOpen);const requested=params().get('event')||'';$('eventSelect').innerHTML=events.map(e=>`<option value="${e.id}">${title(e)}</option>`).join('');if(requested&&events.some(e=>String(e.id)===requested))$('eventSelect').value=requested;if(!events.length){$('status').textContent=t('noLive');$('eventSelect').disabled=true;$('copyBtn').disabled=true;$('openBtn').removeAttribute('href');$('openBtn').setAttribute('aria-disabled','true');$('qr').classList.add('hidden');show(t('empty'),true);return}render()}
    $('eventSelect').onchange=render;$('copyBtn').onclick=copy;$('languageBtn').onclick=()=>{localStorage.setItem('gdsq_v2_ui_lang',lang()==='th'?'en':'th');applyLanguage()};$('qr').onerror=()=>$('qrError').classList.remove('hidden');applyLanguage();boot().catch(error=>show(error.message||t('empty'),true));
  </script>
</body>
</html>
