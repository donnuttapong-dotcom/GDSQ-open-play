<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>GDSQ Claim Player History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--lime:#c7ff2e;--bg:#0b1117;--card:#18212a;--line:#34414d;--muted:#9aa9b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,'Noto Sans Thai',sans-serif}.cut{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}.card{background:var(--card);border:1px solid var(--line)}.soft{background:#0f171f;border:1px solid rgba(255,255,255,.1);border-radius:8px}.lime{color:var(--lime)}.muted{color:var(--muted);font-size:12px}.btn{min-height:46px;border:1px solid rgba(255,255,255,.16);font-weight:900}.primary{background:var(--lime);color:#071018}input[type=email]{width:100%;min-height:48px;border:1px solid #3b4854;border-radius:8px;background:#0b1117;color:#fff;padding:12px}button:disabled{opacity:.5;cursor:not-allowed}
  </style>
</head>
<body>
  <header class="border-b border-white/10 p-3"><div class="mx-auto flex max-w-xl items-center justify-between gap-3"><div><div class="text-[10px] tracking-[.22em] lime">GDSQ PICKLEBALL</div><b id="pageTitle">ขอเชื่อมประวัติผู้เล่น</b></div><div class="flex gap-2"><a id="backLink" class="cut btn bg-white/5 px-3 py-3 text-xs" href="./hall-of-fame.html?mode=supabase">กลับ</a><button id="languageBtn" class="cut btn bg-white/5 px-3 text-xs" type="button">EN</button></div></div></header>
  <main class="mx-auto max-w-xl p-4">
    <section class="cut card mt-3 p-5"><p class="text-xs font-black tracking-[.16em] lime">PROFILE CLAIM</p><h1 id="heading" class="mt-1 text-3xl font-black">นี่คือประวัติของคุณหรือไม่?</h1><p id="intro" class="muted mt-2">คำขอจะไม่เชื่อมทันที Admin ต้องตรวจสอบก่อนเพื่อป้องกันการอ้างสิทธิ์ผิดคน</p><div id="candidate" class="soft mt-4 p-4"><p class="muted">กำลังโหลด...</p></div><div id="message" class="hidden mt-4 rounded-lg border p-3 text-sm" role="status"></div></section>
    <section id="authCard" class="cut card mt-4 p-5"><h2 id="accountTitle" class="text-xl font-black">ยืนยันบัญชีผู้เล่น</h2><div id="signedOut"><label class="mt-3 block text-xs font-black text-slate-400"><span id="emailLabel">อีเมล</span><input id="email" class="mt-2" type="email" autocomplete="email" placeholder="name@example.com"></label><button id="sendLink" class="cut primary mt-3 w-full px-4 py-4 font-black" type="button">ส่งลิงก์ยืนยันอีเมล</button></div><div id="signedIn" class="soft mt-3 hidden p-3"><b id="accountEmail"></b><p id="verifiedLabel" class="muted mt-1">Email Verified</p></div></section>
    <section id="claimCard" class="cut card mt-4 hidden p-5"><label class="flex items-start gap-3"><input id="confirmOwner" class="mt-1 h-5 w-5" type="checkbox"><span id="confirmLabel" class="text-sm">ฉันยืนยันว่าประวัติการแข่งขันนี้เป็นของฉัน</span></label><button id="claimBtn" class="cut primary mt-4 w-full px-4 py-4 font-black" type="button" disabled>ส่งคำขอให้ Admin ตรวจสอบ</button><a id="profileLink" class="cut btn mt-2 block bg-white/5 px-4 py-4 text-center" href="./my-profile.html?mode=supabase">เปิดโปรไฟล์ของฉัน</a></section>
  </main>
  <script type="module">
    import { createV2Services } from './src/services/index.js?v=verified-identity-01';
    import { getSupabaseClient } from './src/services/supabaseClient.js';
    const $=id=>document.getElementById(id),services=createV2Services({mode:'supabase'}),supabase=getSupabaseClient(),eventPlayerId=new URLSearchParams(location.search).get('eventPlayer')||'';
    let auth=null,profile=null,candidate=null,busy=false;
    const lang=()=>localStorage.getItem('gdsq_v2_ui_lang')==='en'?'en':'th',words={th:{page:'ขอเชื่อมประวัติผู้เล่น',back:'กลับ',heading:'นี่คือประวัติของคุณหรือไม่?',intro:'คำขอจะไม่เชื่อมทันที Admin ต้องตรวจสอบก่อนเพื่อป้องกันการอ้างสิทธิ์ผิดคน',account:'ยืนยันบัญชีผู้เล่น',email:'อีเมล',send:'ส่งลิงก์ยืนยันอีเมล',sent:'ส่งลิงก์แล้ว กรุณาเปิดอีเมลบนเครื่องนี้',verified:'ยืนยันอีเมลแล้ว',confirm:'ฉันยืนยันว่าประวัติการแข่งขันนี้เป็นของฉัน',claim:'ส่งคำขอให้ Admin ตรวจสอบ',profile:'เปิดโปรไฟล์ของฉัน',pending:'ส่งคำขอแล้ว กำลังรอ Admin ตรวจสอบ',approved:'ประวัตินี้เชื่อมกับโปรไฟล์แล้ว',rejected:'คำขอนี้ไม่ได้รับอนุมัติ กรุณาติดต่อ Admin',missing:'ไม่พบประวัติผู้เล่นจากลิงก์นี้',profileRequired:'ยังไม่มีโปรไฟล์ถาวร กรุณาเข้าร่วมอีเวนต์ Live ผ่าน QR ก่อน',authRequired:'กรุณายืนยันอีเมลก่อน',error:'ดำเนินการไม่สำเร็จ'},en:{page:'CLAIM PLAYER HISTORY',back:'BACK',heading:'Is this your player history?',intro:'Nothing is linked immediately. Admin review protects players from incorrect claims.',account:'Verify player account',email:'Email',send:'SEND VERIFICATION LINK',sent:'Link sent. Open the email on this device.',verified:'Email Verified',confirm:'I confirm this competition history belongs to me.',claim:'SEND FOR ADMIN REVIEW',profile:'OPEN MY PROFILE',pending:'Request submitted and waiting for Admin review.',approved:'This history is linked to your profile.',rejected:'This request was not approved. Contact Admin.',missing:'This player history link is invalid.',profileRequired:'No permanent profile yet. Join a LIVE event through its QR page first.',authRequired:'Verify your email first.',error:'Could not complete this action.'}},t=key=>words[lang()][key]||key,esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    function show(text,error=false){const box=$('message');box.textContent=text;box.className=`mt-4 rounded-lg border p-3 text-sm ${error?'border-red-300/40 bg-red-300/10':'border-lime-300/40 bg-lime-300/10'}`;}
    function applyLanguage(){document.documentElement.lang=lang();$('languageBtn').textContent=lang()==='th'?'EN':'TH';$('pageTitle').textContent=t('page');$('backLink').textContent=t('back');$('heading').textContent=t('heading');$('intro').textContent=t('intro');$('accountTitle').textContent=t('account');$('emailLabel').textContent=t('email');$('sendLink').textContent=t('send');$('verifiedLabel').textContent=t('verified');$('confirmLabel').textContent=t('confirm');$('claimBtn').textContent=t('claim');$('profileLink').textContent=t('profile');renderCandidate();}
    function renderCandidate(){if(!candidate)return;$('candidate').innerHTML=`<div class="flex justify-between gap-3"><div><p class="muted">PLAYER HISTORY</p><b class="text-2xl lime">${esc(candidate.display_name)}</b></div><b>LV ${Number(candidate.estimated_level||0).toFixed(2)}</b></div><p class="muted mt-2">${esc(candidate.event?.name||'GDSQ Open Play')} · ${esc(candidate.event?.event_date||'')}</p>`;}
    function renderAuth(){$('signedOut').classList.toggle('hidden',Boolean(auth));$('signedIn').classList.toggle('hidden',!auth);$('accountEmail').textContent=auth?.email||'';$('claimCard').classList.toggle('hidden',!auth?.emailVerified||!profile);}
    async function loadCandidate(){if(!eventPlayerId)return show(t('missing'),true);const {data,error}=await supabase.from('v2_event_players').select('id,event_id,player_id,display_name,estimated_level,event:v2_events(name,event_date)').eq('id',eventPlayerId).maybeSingle();if(error)throw error;if(!data||data.player_id)return show(t('missing'),true);candidate=data;renderCandidate();}
    async function loadAccount(){auth=await services.getAuthenticatedPlayer();if(auth?.emailVerified)profile=await services.findPlayerProfileByEmail(auth.email);renderAuth();if(auth?.emailVerified&&!profile)show(t('profileRequired'),true);if(profile){const claims=await services.listMyPlayerProfileClaims(),claim=claims.find(item=>String(item.event_player_id)===String(eventPlayerId));if(claim){show(t(claim.status),claim.status==='rejected');$('claimBtn').disabled=true;$('confirmOwner').disabled=true;}}}
    async function sendLink(){const email=$('email').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(email))return show(t('authRequired'),true);const redirect=new URL(location.href);redirect.searchParams.set('eventPlayer',eventPlayerId);redirect.searchParams.set('mode','supabase');try{await services.sendPlayerSignInLink(email,redirect.toString());show(t('sent'));}catch(error){show(error.message||t('error'),true)}}
    async function claim(){if(busy||!profile||!$('confirmOwner').checked)return;busy=true;$('claimBtn').disabled=true;try{await services.requestPlayerProfileClaim(eventPlayerId);show(t('pending'));}catch(error){show(error.message||t('error'),true);$('claimBtn').disabled=false}finally{busy=false}}
    $('languageBtn').onclick=()=>{localStorage.setItem('gdsq_v2_ui_lang',lang()==='th'?'en':'th');applyLanguage()};$('sendLink').onclick=sendLink;$('confirmOwner').onchange=event=>$('claimBtn').disabled=!event.target.checked;$('claimBtn').onclick=claim;applyLanguage();Promise.all([loadCandidate(),loadAccount()]).catch(error=>show(error.message||t('error'),true));
  </script>
</body>
</html>
